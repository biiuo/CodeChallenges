

services:
  db:
    image: postgres:16
    container_name: db_proyecto_final
    restart: unless-stopped
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      context: .
      target: development
    container_name: api_proyecto_final
    environment:
      DATABASE_URL: "postgresql://user:pass@db:5432/db?schema=public"
      REDIS_URL: "redis://default:redispass@redis:6379/0"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "redispass"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/app/src  # Mount source for hot reload
      - ./prisma:/app/prisma  # Mount prisma schema
      - /app/node_modules  # Preserve node_modules from image
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["npm", "run", "start:dev"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redispass"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-commander:
    image: rediscommander/redis-commander:latest
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redispass
    ports:
      - "8081:8081"

  # Runner images for code execution (built but not run as services)
  runner-python:
    build:
      context: ./runners/runner-python
      dockerfile: Dockerfile
    image: runner-python:latest
    profiles: ["build-only"]

  runner-node:
    build:
      context: ./runners/runner-node
      dockerfile: Dockerfile
    image: runner-node:latest
    profiles: ["build-only"]

  runner-cpp:
    build:
      context: ./runners/runner-cpp
      dockerfile: Dockerfile
    image: runner-cpp:latest
    profiles: ["build-only"]

  runner-java:
    build:
      context: ./runners/runner-java
      dockerfile: Dockerfile
    image: runner-java:latest
    profiles: ["build-only"]

volumes:
  db_data: