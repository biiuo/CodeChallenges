version: '3.8'
services:
  backend:
    container_name: api_proyecto_final
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:pass@db:5432/codechallenges?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecret
      - JWT_ACCESS_SECRET=dev-access-secret-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codechallenges-runs:/tmp/codechallenges-runs
    environment:
      - NODE_ENV=development
      - ENABLE_WORKER=true
      - RUNNER_TMP_DIR=/tmp/codechallenges-runs
      - DATABASE_URL=postgresql://user:pass@db:5432/codechallenges?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecret
    depends_on:
      - backend
      - redis
      - db
    # Los runners no son servicios, solo imágenes preconstruidas

  # Code execution runner images
  # These are built automatically but only used by worker via 'docker run'
  # Using 'scale: 0' ensures images are built but containers don't start
  runner-python:
    image: runner-python:latest
    build:
      context: ./runners
      dockerfile: runner-python/Dockerfile
    command: "true"  # No-op command
    deploy:
      replicas: 0  # No iniciar contenedores
    restart: "no"

  runner-node:
    image: runner-node:latest
    build:
      context: ./runners
      dockerfile: runner-node/Dockerfile
    command: "true"
    deploy:
      replicas: 0
    restart: "no"

  runner-java:
    image: runner-java:latest
    build:
      context: ./runners
      dockerfile: runner-java/Dockerfile
    command: "true"
    deploy:
      replicas: 0
    restart: "no"

  runner-cpp:
    image: runner-cpp:latest
    build:
      context: ./runners
      dockerfile: runner-cpp/Dockerfile
    command: "true"
    deploy:
      replicas: 0
    restart: "no"
  

  db:
    container_name: db_proyecto_final
    image: postgres:16
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: codechallenges
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d codechallenges"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  frontend:
    container_name: frontend_proyecto_final
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  pgdata:
